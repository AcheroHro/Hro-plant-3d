<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12161f" />
    <meta name="description" content="Achero Plant 3D - Motor CAD móvil de alta precisión para ruteo de cañerías industriales 3D con integración de catálogos AutoCAD Plant 3D." />
    <link rel="manifest" href="/manifest.json" />
    <title>Achero Plant 3D | Motor CAD Móvil de Cañerías</title>
  </head>
  <body class="bg-cad-dark text-slate-100 overflow-hidden select-none m-0 p-0 h-full w-full" style="background-color: #12161f; margin: 0; padding: 0;">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
